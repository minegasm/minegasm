plugins {
    id 'java'
    id 'xyz.wagyourtail.unimined' version '1.4.1'
    id 'com.gradleup.shadow' version '8.3.6'
}

group = 'net.minegasm'
version = providers.gradleProperty('mod_version').get()
base { archivesName = 'minegasm' }

// Match the modern jar convention: minegasm-<version>+mc<mcversion>-forge.jar. This subproject is a
// single Forge version; the Minecraft version comes from gradle.properties.
def artifactName = "minegasm-${version}+mc${project.minecraft_version}-forge"
tasks.named('jar') { archiveFileName = "${artifactName}-dev.jar" }

unimined.useGlobalCache = false

// Compile the mod (and the shared engine) to Java 8, the runtime stock 1.12.2 uses. The Gradle daemon
// runs on JDK 21 (unimined needs Gradle 8.8); the toolchain is decoupled from that.
java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}
tasks.withType(JavaCompile).configureEach { options.release = 8 }

// Consume the shared engine and the version-agnostic Minecraft glue in place, the same way the modern
// build srcDir's the engine. The engine is Java 8 source with no Minecraft imports.
sourceSets {
    main {
        java.srcDir rootProject.file('../engine/src/main/java')
        java.srcDir rootProject.file('common/src/main/java')
        // net.minecraftforge.fml entrypoint, shared with 1.8.9 (1.7.10 uses cpw.mods.fml instead).
        java.srcDir rootProject.file('forge/src/main/java')
    }
}

repositories {
    maven { url = "https://maven.wagyourtail.xyz/releases" }
    maven { url = "https://repo.spongepowered.org/maven" }
    mavenCentral()
}

// The engine's Buttplug backends: buttplug4j (default) + Gson (config + native codec). 1.12.2 Forge has
// no jar-in-jar, so they are relocated and shaded into the reobfuscated jar. `shade` is on the compile
// classpath (implementation extends it) but only `shade` is bundled, so Minecraft's own libraries are
// never pulled in.
configurations {
    shade
    implementation.extendsFrom shade
}

dependencies {
    shade 'com.google.code.gson:gson:2.11.0'
    shade 'io.github.blackspherefollower:buttplug4j.connectors.jetty.websocket.client:4.0.278'
    // The native provider's WebSocket client (ADR-019). Java-WebSocket calls slf4j at runtime, and Jetty
    // declares slf4j-api optional so it never reaches the shade bucket. Bundle it explicitly (it rides the
    // org.slf4j relocation below); without it Draft_6455 fails with NoClassDefFoundError on first connect.
    shade('org.java-websocket:Java-WebSocket:1.5.7') { transitive = false }
    shade 'org.slf4j:slf4j-api:1.7.36'
    // Relocated NOP binding so slf4j resolves silently instead of printing its "no binding" notice.
    shade 'org.slf4j:slf4j-nop:1.7.36'
    // Loopback test for ClassicWebSocketTransport (shared source in common); Java-WebSocket's server
    // drives the client end to end. The shade bucket does not reach the test runtime classpath here, so
    // the library is declared for the test directly.
    testImplementation 'org.java-websocket:Java-WebSocket:1.5.7'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

test {
    useJUnitPlatform()
}

shadowJar {
    configurations = [project.configurations.shade]
    archiveFileName = "${artifactName}-shaded.jar"
    mergeServiceFiles()
    // Legacy Forge's classpath scanner (old ASM) cannot parse the Java 11+ bytecode in Jackson's
    // multi-release entries and rejects the whole jar as corrupt, so the mod never loads. Strip them:
    // we target Java 8, and every versioned class has a Java 8 base copy at the root, so nothing is lost.
    exclude 'META-INF/versions/**'
    relocate 'io.github.blackspherefollower', 'net.minegasm.shadow.buttplug4j'
    relocate 'com.google.gson', 'net.minegasm.shadow.gson'
    relocate 'org.eclipse.jetty', 'net.minegasm.shadow.jetty'
    relocate 'com.fasterxml.jackson', 'net.minegasm.shadow.jackson'
    relocate 'org.slf4j', 'net.minegasm.shadow.slf4j'
    relocate 'org.java_websocket', 'net.minegasm.shadow.javawebsocket'
}

unimined.minecraft {
    version project.minecraft_version
    mappings {
        searge()
        mcp('stable', '39-1.12')
    }
    minecraftForge {
        loader project.forge_version
    }
}

// Reobfuscate the shaded fat jar rather than the thin jar, so the relocated libraries ride along in the
// final artifact.
afterEvaluate {
    tasks.named('remapJar') {
        dependsOn shadowJar
        inputFile = shadowJar.archiveFile
        archiveFileName = "${artifactName}.jar"
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('mcmod.info') { expand 'version': project.version }
}
