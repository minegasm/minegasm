// Minegasm Classic: the legacy-Minecraft build (Forge on 1.7.10 / 1.8.9 / 1.12.2), separate from the
// root Stonecutter+Loom build. Runs on unimined, which needs Gradle 8.8 on a JDK 21 daemon, so it
// pins its own wrapper. Each Minecraft version is its own unimined subproject; they share the engine
// (via a srcDir onto ../engine) and the version-agnostic Minecraft glue under common/. See
// /RESTRUCTURE.md.
pluginManagement {
    repositories {
        mavenCentral()
        maven { url = "https://maven.minecraftforge.net/" }
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://maven.wagyourtail.xyz/releases" }
        maven { url = "https://maven.wagyourtail.xyz/snapshots" }
        gradlePluginPortal() { content { excludeGroup("org.apache.logging.log4j") } }
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
rootProject.name = 'minegasm-classic'
include '1.7.10'
include '1.8.9'
include '1.12.2'
