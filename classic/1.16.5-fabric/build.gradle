plugins {
    id 'java'
    id 'xyz.wagyourtail.unimined' version '1.4.1'
    id 'com.gradleup.shadow' version '8.3.6'
}

group = 'net.minegasm'
version = providers.gradleProperty('mod_version').get()
base { archivesName = 'minegasm' }

// minegasm-<version>+mc<mcversion>-fabric.jar, matching the modern/Forge naming.
def artifactName = "minegasm-${version}+mc${project.minecraft_version}-fabric"
tasks.named('jar') { archiveFileName = "${artifactName}-dev.jar" }

unimined.useGlobalCache = false

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}
tasks.withType(JavaCompile).configureEach { options.release = 8 }

// The Fabric 1.16.5 loader layer. It shares the engine and common glue, and the vanilla-facing 1.16.5
// sampler/screen/keybinds with the Forge subproject; only the loader hooks differ.
sourceSets {
    main {
        java.srcDir rootProject.file('../engine/src/main/java')
        java.srcDir rootProject.file('common/src/main/java')
        // Vanilla-facing 1.16.5 code shared with the Forge subproject; only the loader hooks differ.
        java.srcDir rootProject.file('1.16.5-common/src/main/java')
        // Shared assets (the keybind/lang JSON); mod metadata (fabric.mod.json) stays per-subproject.
        resources.srcDir rootProject.file('1.16.5-common/src/main/resources')
    }
}

repositories {
    maven { url = "https://maven.wagyourtail.xyz/releases" }
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.terraformersmc.com/releases" }
    mavenCentral()
}

// buttplug4j + Gson relocated and shaded, same as the Forge subprojects.
configurations {
    shade
    implementation.extendsFrom shade
}

// Configure the Minecraft/Fabric side first: this creates the mod dependency configurations
// (modImplementation) that the dependencies block below uses.
unimined.minecraft {
    version project.minecraft_version
    mappings {
        intermediary()
        mojmap()
    }
    fabric {
        loader project.fabric_loader_version
    }
}

dependencies {
    shade 'com.google.code.gson:gson:2.11.0'
    shade 'io.github.blackspherefollower:buttplug4j.connectors.jetty.websocket.client:4.0.278'
    // The native provider's WebSocket client (ADR-019). Java-WebSocket calls slf4j at runtime, and Jetty
    // declares slf4j-api optional so it never reaches the shade bucket. Bundle it explicitly (it rides the
    // org.slf4j relocation below); without it Draft_6455 fails with NoClassDefFoundError on first connect.
    shade('org.java-websocket:Java-WebSocket:1.5.7') { transitive = false }
    shade 'org.slf4j:slf4j-api:1.7.36'
    // Fabric API provides the client tick, keybinding, and client-command APIs the entrypoint uses.
    // It is a separate mod the player installs (declared in fabric.mod.json), not bundled.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    // Mod Menu supplies the config-screen button in its mod list. Optional at runtime; the modmenu
    // entrypoint only loads when Mod Menu is present.
    modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
}

shadowJar {
    configurations = [project.configurations.shade]
    archiveFileName = "${artifactName}-shaded.jar"
    mergeServiceFiles()
    exclude 'META-INF/versions/**'
    relocate 'io.github.blackspherefollower', 'net.minegasm.shadow.buttplug4j'
    relocate 'com.google.gson', 'net.minegasm.shadow.gson'
    relocate 'org.eclipse.jetty', 'net.minegasm.shadow.jetty'
    relocate 'com.fasterxml.jackson', 'net.minegasm.shadow.jackson'
    relocate 'org.slf4j', 'net.minegasm.shadow.slf4j'
    relocate 'org.java_websocket', 'net.minegasm.shadow.javawebsocket'
}

// Remap the shaded fat jar to intermediary so Fabric loads it.
afterEvaluate {
    tasks.named('remapJar') {
        dependsOn shadowJar
        inputFile = shadowJar.archiveFile
        archiveFileName = "${artifactName}.jar"
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}
