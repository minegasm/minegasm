plugins {
    id 'java'
    id 'xyz.wagyourtail.unimined' version '1.4.1'
    id 'com.gradleup.shadow' version '8.3.6'
}

group = 'net.minegasm'
version = providers.gradleProperty('mod_version').get()
base { archivesName = 'minegasm' }

// minegasm-<version>+mc<mcversion>-fabric.jar, matching the modern/Forge naming.
def artifactName = "minegasm-${version}+mc${project.minecraft_version}-fabric"
tasks.named('jar') { archiveFileName = "${artifactName}-dev.jar" }

unimined.useGlobalCache = false

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}
tasks.withType(JavaCompile).configureEach { options.release = 8 }

// The Fabric 1.16.5 loader layer. It shares the engine and common glue, and (once written) the
// vanilla-facing 1.16.5 sampler/screen with the Forge subproject; only the loader hooks differ.
sourceSets {
    main {
        java.srcDir rootProject.file('../engine/src/main/java')
        java.srcDir rootProject.file('common/src/main/java')
    }
}

repositories {
    maven { url = "https://maven.wagyourtail.xyz/releases" }
    maven { url = "https://maven.fabricmc.net/" }
    mavenCentral()
}

// buttplug4j + Gson relocated and shaded, same as the Forge subprojects.
configurations {
    shade
    implementation.extendsFrom shade
}

dependencies {
    shade 'com.google.code.gson:gson:2.11.0'
    shade 'io.github.blackspherefollower:buttplug4j.connectors.jetty.websocket.client:4.0.278'
}

shadowJar {
    configurations = [project.configurations.shade]
    archiveFileName = "${artifactName}-shaded.jar"
    mergeServiceFiles()
    exclude 'META-INF/versions/**'
    relocate 'io.github.blackspherefollower', 'net.minegasm.shadow.buttplug4j'
    relocate 'com.google.gson', 'net.minegasm.shadow.gson'
    relocate 'org.eclipse.jetty', 'net.minegasm.shadow.jetty'
    relocate 'com.fasterxml.jackson', 'net.minegasm.shadow.jackson'
    relocate 'org.slf4j', 'net.minegasm.shadow.slf4j'
}

unimined.minecraft {
    version project.minecraft_version
    mappings {
        intermediary()
        mojmap()
    }
    fabric {
        loader project.fabric_loader_version
    }
}

// Remap the shaded fat jar to intermediary so Fabric loads it.
afterEvaluate {
    tasks.named('remapJar') {
        dependsOn shadowJar
        inputFile = shadowJar.archiveFile
        archiveFileName = "${artifactName}.jar"
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}
