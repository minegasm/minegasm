#This file is consumed by Gradle's daemon JVM criteria.
#It pins the Classic build's daemon to a JDK 21 toolchain, because Gradle 8.8 and unimined do not run
#on Java 25 (the default JDK for the modern build). Gradle selects or provisions a matching JDK for the
#daemon, so `./gradlew` here works regardless of the caller's JAVA_HOME. See classic/PORTING.md.
toolchainVersion=21
