plugins {
    id 'java'
    id 'xyz.wagyourtail.unimined' version '1.4.1'
    id 'com.gradleup.shadow' version '8.3.6'
}

group = 'net.minegasm'
version = providers.gradleProperty('mod_version').get()
base { archivesName = 'minegasm' }

// Match the modern jar convention: minegasm-<version>+mc<mcversion>-forge.jar. This subproject is a
// single Forge version; the Minecraft version comes from gradle.properties.
def artifactName = "minegasm-${version}+mc${project.minecraft_version}-forge"
tasks.named('jar') { archiveFileName = "${artifactName}-dev.jar" }

unimined.useGlobalCache = false

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}
tasks.withType(JavaCompile).configureEach { options.release = 8 }

// 1.7.10 uses cpw.mods.fml, so its entrypoint lives in this subproject's own src (not the shared
// forge/ dir that 1.8.9 and 1.12.2 use). It still shares the engine and the common glue.
sourceSets {
    main {
        java.srcDir rootProject.file('../engine/src/main/java')
        java.srcDir rootProject.file('common/src/main/java')
    }
}

repositories {
    maven { url = "https://maven.wagyourtail.xyz/releases" }
    maven { url = "https://repo.spongepowered.org/maven" }
    mavenCentral()
}

// buttplug4j + Gson are relocated and shaded into the reobfuscated jar (no jar-in-jar on this Forge).
// `shade` is on the compile classpath but only it is bundled, so Minecraft's own libraries are excluded.
configurations {
    shade
    implementation.extendsFrom shade
}

dependencies {
    shade 'com.google.code.gson:gson:2.11.0'
    shade 'io.github.blackspherefollower:buttplug4j.connectors.jetty.websocket.client:4.0.278'
}

shadowJar {
    configurations = [project.configurations.shade]
    archiveFileName = "${artifactName}-shaded.jar"
    mergeServiceFiles()
    // Legacy Forge's classpath scanner (old ASM) cannot parse the Java 11+ bytecode in Jackson's
    // multi-release entries and rejects the whole jar as corrupt, so the mod never loads. Strip them:
    // we target Java 8, and every versioned class has a Java 8 base copy at the root, so nothing is lost.
    exclude 'META-INF/versions/**'
    relocate 'io.github.blackspherefollower', 'net.minegasm.shadow.buttplug4j'
    relocate 'com.google.gson', 'net.minegasm.shadow.gson'
    relocate 'org.eclipse.jetty', 'net.minegasm.shadow.jetty'
    relocate 'com.fasterxml.jackson', 'net.minegasm.shadow.jackson'
    relocate 'org.slf4j', 'net.minegasm.shadow.slf4j'
}

unimined.minecraft {
    version project.minecraft_version
    mappings {
        searge()
        mcp('stable', '12-1.7.10')
    }
    minecraftForge {
        loader project.forge_version
    }
}

// Reobfuscate the shaded fat jar so the relocated libraries ride along in the final artifact.
afterEvaluate {
    tasks.named('remapJar') {
        dependsOn shadowJar
        inputFile = shadowJar.archiveFile
        archiveFileName = "${artifactName}.jar"
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('mcmod.info') { expand 'version': project.version }
}
