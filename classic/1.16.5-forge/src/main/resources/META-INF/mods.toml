modLoader="javafml"
loaderVersion="[36,)"
license="AGPL-3.0"

[[mods]]
modId="minegasm"
version="${version}"
displayName="Minegasm"
logoFile="icon.png"
description='''
Responsive, customizable haptic feedback for Minecraft across compatible devices. Entirely client-side.
'''

[[dependencies.minegasm]]
    modId="forge"
    mandatory=true
    versionRange="[36,)"
    ordering="NONE"
    side="CLIENT"

# Forge 1.16.5 does not ship Mixin. MixinBootstrap provides the Mixin service that loads our client
# command mixin; install it alongside this mod. It is a launch-service library, not a registered Forge
# mod, so it cannot be declared as a dependency here (it would always read as "missing"); its presence in
# the mods folder is what matters.

[[dependencies.minegasm]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.16.5]"
    ordering="NONE"
    side="CLIENT"
