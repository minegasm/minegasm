name: Build Classic

# Minegasm Classic is a separate build (unimined + Forge on 1.7.10/1.8.9/1.12.2, Gradle 8.8, Java 8
# output) that runs on a JDK 21 daemon, not the modern build's Java 25. See classic/PORTING.md.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build all Classic versions
        working-directory: classic
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace --warning-mode all

      - name: Verify packaged artifacts
        working-directory: classic
        run: |
          shopt -s nullglob
          mkdir -p dist
          for sub in 1.7.10-forge 1.8.9-forge 1.12.2-forge 1.16.5-forge 1.16.5-fabric; do
            mc="${sub%-*}"; loader="${sub##*-}"
            jars=("$sub"/build/libs/minegasm-*+mc"$mc"-"$loader".jar)
            if [ "${#jars[@]}" -ne 1 ]; then
              echo "ERROR: expected exactly one reobfuscated jar for $sub, found ${#jars[@]}" >&2
              exit 1
            fi
            jar="${jars[0]}"
            echo "Verifying $jar"
            # Use the JDK jar tool by absolute path; a bare `jar` is not always on PATH in later steps.
            entries="$("$JAVA_HOME/bin/jar" tf "$jar")"
            if [ -z "$entries" ]; then
              echo "ERROR: could not list $jar with $JAVA_HOME/bin/jar" >&2
              exit 1
            fi

            # Feed grep from a here-string, never `echo "$entries" | grep -q`. Under `bash -o pipefail`
            # `grep -q` closes the pipe on its first match, the still-writing `echo` dies with SIGPIPE, and
            # pipefail makes that the pipeline's status, so a real match is misread as failure. A
            # here-string is not a pipeline, so the result reflects grep alone.
            # The mod entrypoint (Forge: MinegasmClassicMod, Fabric: MinegasmClassicClient) and engine.
            if ! grep -qE '^net/minegasm/classic/(MinegasmClassicMod|MinegasmClassicClient)\.class$' <<< "$entries"; then
              echo "ERROR: $jar is missing the mod entrypoint" >&2
              echo "--- net/minegasm/classic entries present in $jar: ---" >&2
              grep -E '^net/minegasm/classic/' <<< "$entries" >&2 || echo "(none)" >&2
              exit 1
            fi
            grep -q '^net/minegasm/core/' <<< "$entries" \
              || { echo "ERROR: $jar is missing the shared engine classes" >&2; exit 1; }
            # The Buttplug stack is shaded and relocated (no jar-in-jar on this Forge).
            grep -q '^net/minegasm/shadow/buttplug4j/' <<< "$entries" \
              || { echo "ERROR: $jar is missing the shaded buttplug4j classes" >&2; exit 1; }
            # Legacy FML cannot scan Java 11+ multi-release entries; they must be stripped.
            if grep -q '^META-INF/versions/.*\.class$' <<< "$entries"; then
              echo "ERROR: $jar still contains META-INF/versions class entries (legacy FML would reject it)" >&2
              exit 1
            fi

            cp "$jar" dist/
          done

      - name: Upload built jars
        uses: actions/upload-artifact@v7
        with:
          name: minegasm-classic-jars-${{ github.run_id }}
          path: classic/dist/
          if-no-files-found: error
