name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Build and test every variant
        working-directory: modern
        run: |
          chmod +x gradlew
          ./gradlew chiseledBuild --no-daemon --stacktrace --warning-mode all

      - name: Verify packaged artifacts
        working-directory: modern
        run: |
          shopt -s nullglob
          artifacts=(versions/*/build/libs/minegasm-*.jar)
          if [ "${#artifacts[@]}" -lt 1 ]; then
            echo "ERROR: no minegasm-*.jar found under versions/*/build/libs/" >&2
            exit 1
          fi

          for artifact in "${artifacts[@]}"; do
            echo "Verifying $artifact"
            entries="$(jar tf "$artifact")"
            # Feed grep from a here-string, never `echo "$entries" | grep -q`: under `bash -o pipefail`,
            # `grep -q` closes the pipe on its first match and the still-writing producer dies with SIGPIPE,
            # which pipefail turns into the pipeline's status, misreading a real match as failure.
            grep -q '^META-INF/LICENSE-minegasm$' <<< "$entries" \
              || { echo "ERROR: $artifact is missing META-INF/LICENSE-minegasm" >&2; exit 1; }
            # Jar-in-jar bundling format differs by loader: Forge/NeoForge (Loom) writes a
            # jarjar/metadata.json manifest; Fabric records bundled jars in fabric.mod.json's "jars"
            # array instead. Both still place the actual nested jars under META-INF/jars/.
            case "$artifact" in
              *-fabric.jar)
                grep -q '"jars"' <<< "$(unzip -p "$artifact" fabric.mod.json)" \
                  || { echo "ERROR: $artifact is missing a fabric.mod.json \"jars\" entry" >&2; exit 1; }
                ;;
              *)
                grep -q '^META-INF/jarjar/metadata.json$' <<< "$entries" \
                  || { echo "ERROR: $artifact is missing META-INF/jarjar/metadata.json" >&2; exit 1; }
                ;;
            esac
            grep -qE '^META-INF/jars/buttplug4j-[0-9].*\.jar$' <<< "$entries" \
              || { echo "ERROR: $artifact is missing a bundled buttplug4j jar. Actual META-INF/jars/ entries:"; grep '^META-INF/jars/' <<< "$entries" >&2; exit 1; }
          done

          mkdir -p dist
          cp "${artifacts[@]}" dist/
          # No 1.20.1-neoforge build variant exists, but early NeoForge on 1.20.1 loads the Forge jar.
          # Upload a neoforge-named copy so the artifact set matches the release (mirrors installJars).
          for f in dist/minegasm-*+mc1.20.1-forge.jar; do
            cp "$f" "${f/+mc1.20.1-forge/+mc1.20.1-neoforge}"
          done

      - name: Upload built jars
        uses: actions/upload-artifact@v7
        with:
          name: minegasm-jars-${{ github.run_id }}
          path: modern/dist/
          if-no-files-found: error
