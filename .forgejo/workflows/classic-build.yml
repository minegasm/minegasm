name: Build Classic

# Minegasm Classic is a separate build (unimined + Forge on 1.7.10/1.8.9/1.12.2, Gradle 8.8, Java 8
# output) that runs on a JDK 21 daemon, not the modern build's Java 25. See classic/PORTING.md. Build
# and verify only; releases are handled by the modern build.yml.
#
# One job per version subproject (they build independently: the engine and common glue are shared via
# srcDir, not cross-project dependencies), so the five run in parallel instead of one long serial build.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        sub:
          - 1.7.10-forge
          - 1.8.9-forge
          - 1.12.2-forge
          - 1.16.5-forge
          - 1.16.5-fabric
    runs-on: codeberg-medium-lazy
    steps:
      - name: Check out source
        env:
          FORGE_URL: ${{ forge.server_url }}
          REPOSITORY: ${{ forge.repository }}
          COMMIT_SHA: ${{ forge.sha }}
        run: |
          git clone --no-checkout --filter=blob:none "$FORGE_URL/$REPOSITORY.git" .
          git checkout --detach "$COMMIT_SHA"

      - name: Set up JDK 21
        run: |
          curl -fsSL -o /tmp/jdk.tar.gz "https://api.adoptium.net/v3/binary/latest/21/ga/linux/x64/jdk/hotspot/normal/eclipse"
          mkdir -p "$HOME/jdk-21"
          tar -xzf /tmp/jdk.tar.gz -C "$HOME/jdk-21" --strip-components=1
          echo "JAVA_HOME=$HOME/jdk-21" >> "$GITHUB_ENV"
          echo "$HOME/jdk-21/bin" >> "$GITHUB_PATH"

      - name: Build ${{ matrix.sub }}
        working-directory: classic
        env:
          SUB: ${{ matrix.sub }}
        run: |
          chmod +x gradlew
          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            ./gradlew ":$SUB:build" --no-daemon --configure-on-demand --stacktrace --warning-mode all 2>&1 | tee gradle-output.log
            status=${PIPESTATUS[0]}
            if [ "$status" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -eq "$max_attempts" ] || ! grep -qE 'failed to respond|Could not GET|Could not resolve all (files|artifacts) for configuration|Read timed out|Connection reset|UnknownHostException' gradle-output.log; then
              echo "Gradle build failed (attempt $attempt/$max_attempts); not retrying further." >&2
              exit "$status"
            fi
            echo "Transient dependency-resolution failure detected (attempt $attempt/$max_attempts); retrying after a pause..." >&2
            sleep 20
          done

      - name: Verify and stage ${{ matrix.sub }}
        working-directory: classic
        env:
          SUB: ${{ matrix.sub }}
        run: |
          shopt -s nullglob
          mkdir -p dist
          sub="$SUB"
          mc="${sub%-*}"; loader="${sub##*-}"
          jars=("$sub"/build/libs/minegasm-*+mc"$mc"-"$loader".jar)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "ERROR: expected exactly one reobfuscated jar for $sub, found ${#jars[@]}" >&2
            exit 1
          fi
          jar="${jars[0]}"
          echo "Verifying $jar"
          # Use the JDK jar tool by absolute path; a bare `jar` is not always on PATH in later steps.
          entries="$("$JAVA_HOME/bin/jar" tf "$jar")"
          if [ -z "$entries" ]; then
            echo "ERROR: could not list $jar with $JAVA_HOME/bin/jar" >&2
            exit 1
          fi

          # Feed grep from a here-string, never `echo "$entries" | grep -q`. Steps run under
          # `bash -e -o pipefail`; `grep -q` closes the pipe on its first match, the still-writing `echo`
          # then dies with SIGPIPE (141), and pipefail makes that the pipeline's status, so a real match
          # is misread as failure. A here-string is not a pipeline, so the result reflects grep alone.
          if ! grep -qE '^net/minegasm/classic/(MinegasmClassicMod|MinegasmClassicClient)\.class$' <<< "$entries"; then
            echo "ERROR: $jar is missing the mod entrypoint" >&2
            echo "--- net/minegasm/classic entries present in $jar: ---" >&2
            grep -E '^net/minegasm/classic/' <<< "$entries" >&2 || echo "(none)" >&2
            exit 1
          fi
          grep -q '^net/minegasm/core/' <<< "$entries" \
            || { echo "ERROR: $jar is missing the shared engine classes" >&2; exit 1; }
          grep -q '^net/minegasm/shadow/buttplug4j/' <<< "$entries" \
            || { echo "ERROR: $jar is missing the shaded buttplug4j classes" >&2; exit 1; }
          if grep -q '^META-INF/versions/.*\.class$' <<< "$entries"; then
            echo "ERROR: $jar still contains META-INF/versions class entries (legacy FML would reject it)" >&2
            exit 1
          fi

          cp "$jar" dist/

      - name: Upload built jar
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: classic-jars-${{ matrix.sub }}
          path: classic/dist/*.jar
